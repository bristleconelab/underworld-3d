name: test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  # queue, never cancel: a cancelled run could stop a Cloudflare Pages upload half way
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:py
      - run: npm run build
      # https://underworld.bristleconelab.org is served by Cloudflare Pages (project underworld-3d).
      # Needs the repository secret CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit); skipped without it.
      - name: Cloudflare token present?
        if: github.event_name != 'pull_request'
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "on=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::CLOUDFLARE_API_TOKEN not set: the live site was NOT updated"; fi
      - name: Deploy to Cloudflare Pages
        if: steps.cf.outputs.on == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 95c89337261f10f37ac1310191b2ebb7
        run: npx --yes wrangler@4.168.0 pages deploy dist --project-name underworld-3d --branch main --commit-hash "$GITHUB_SHA" --commit-message "$(git log -1 --format=%s | head -c 200)"
      # tell Bing and the other IndexNow engines that pages changed (never fails the deploy)
      - name: IndexNow
        if: steps.cf.outputs.on == 'true'
        run: sleep 20 && bash scripts/indexnow.sh || echo "::warning::IndexNow ping failed"
